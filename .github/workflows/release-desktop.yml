name: Release desktop

# 推送 v* 标签，且标签与 package.json 的 version 一致时，为六个桌面目标打包并发布到 GitHub Releases。
# 没有签名证书，产物未签名。远程工作区资源依赖内网下载源，这里不打进安装包。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target_os }} ${{ matrix.target_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target_os: win
            target_arch: x64
          - runner: windows-11-arm
            target_os: win
            target_arch: arm64
          - runner: macos-15
            target_os: mac
            target_arch: arm64
          - runner: macos-15-intel
            target_os: mac
            target_arch: x64
          - runner: ubuntu-24.04
            target_os: linux
            target_arch: x64
          - runner: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
    env:
      HUSKY: "0"
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packaging tools
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg libarchive-tools zstd

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Check tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop
        run: pnpm bundle:desktop -- --os ${{ matrix.target_os }} --arch ${{ matrix.target_arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target_os }}-${{ matrix.target_arch }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 上一个版本标签到这次标签的提交要全在，否则说明只能看到当前一个提交。
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-notes.mjs --tag "$TAG" --repo "$GH_REPO" --out release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --draft
          fi
          gh release upload "$TAG" release-assets/* --clobber
          # 重跑也要覆盖旧说明。只在 create 时写一次会把上一版的固定文案留下。
          gh release edit "$TAG" --notes-file release-notes.md --draft=false
